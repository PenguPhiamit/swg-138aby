; Ossus O15 mirage settings (Claude, 18 Oct 2026). Lives next to SWGEmu.exe; read when the game starts.
; Without this file the same defaults apply. The log is mirage.log in the same folder.
[mirage]
; 0 = the proxy only passes DXVK through and changes nothing (the off switch without uninstalling)
enabled=1
; in game, Ctrl+Shift+M switches the mirage on and off (toggle_key is a Windows key code; mods 1 Ctrl, 2 Shift, 4 Alt)
toggle_key=0x4D
toggle_mods=3
; how far the scene bends at the blade, in pixels
strength=6
; how far past the blade's glow the haze reaches, in pixels
spread=6
; how fast the haze drifts (rises), and how large its ripples are (tiles per screen height: fewer = larger)
speed=0.35
noise_tiles=6
; colour split along the bend, 0 to 1 (the opal fringe)
chroma=0.35
; how strongly the blade's own glow turns into haze
mask_gain=2
; a blade counts as ghostfire when its crystal colour's brightest channel is at or below this (the O14 shader's rule)
max_bright=0.17
; mirage passes per frame at most (each costs two screen-sized passes)
max_per_frame=8
; 1 = list every pixel program id the game creates in mirage.log (only for finding a blade program that did not match)
log_shaders=0
; 1 = paint the haze area instead of bending it: red = mask, green and blue = the two noise layers (for checking)
debug_view=0
; 1 = also hook Windows' own Direct3D 9 when dxvk_d3d9.dll is missing (in the 18 Oct test the haze drew nothing there)
allow_native=0
; more blade program ids in hex, comma-separated, if a future blade shader should count too
extra_ids=
; light whip step 0 (capture): >0 = write that many draws of each blade program to mirage-draws-<pid>.log
; (vertices, layout, vertex constants c0-c11; about 1 KB to 3 KB a draw, two draws a frame per blade). 600 = about 10 s
log_draws=0
; with toggle_mods (Ctrl+Shift): log every blade draw for draw_burst seconds more (0x4C = L; needs log_draws > 0)
draw_key=0x4C
draw_burst=4
